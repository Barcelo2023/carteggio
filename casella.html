<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>

    <link rel="icon" href="img/logo.png"  type="image/png">
    <link rel="stylesheet" href="style-casella.css"> <!-- Il file CSS -->  
    
      <script  src="carico.pubbl.js"></script>
      <script  src="dataora.js"></script>
    
  
  </head>
  <body>
         
     <div class="container">     
    <div  id="datetime"> </div>
  <h1>Carteggio</h1>
  <h2>Pagina crea casella postale</h2>

  <p>Scrivi la tua e-mail</p>
 
  <input type="text" id="email"  required autocomplete="off">

  <div id="error"></div> 
  
  <button type="button" id="btnv">Crea casella</button>           
  <button id="logoutBtn" type="button">Pagina iniziale</button>

  
</div>

      
    
         <script type="module"> 
     let mioIdCasella;
     let chiaveCasella;
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
     import { getFirestore,collection, getDoc, setDoc, addDoc,  doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
     
           
            let  email;                    
            let lengemail;
            let conta;
            let lettera;
            let chioc;


           caricodata();

            (function() {
         // 1. Controlla lo User Agent (cerca esplicitamente Android o iPhone)
          const ua = navigator.userAgent || navigator.vendor || window.opera;
           const isMobileUA = /android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua);
    
             // 2. Controlla la larghezza dello schermo (sotto i 768 pixel)
            const isSmallScreen = window.innerWidth <= 768;

         // Se NON ha un user agent mobile OPPURE lo schermo è troppo grande, bloccalo
          if (!isMobileUA || !isSmallScreen) {
         document .getElementById("error").innerText = "creazione non autorizzata"; 
      }
     })();
                 
        
            document.getElementById('btnv').addEventListener('click', function() { 

        
             email = document.getElementById('email').value; 

                  chioc = " ";
           
                  lengemail = email.length;
                  if (lengemail < 5){
                  document .getElementById("error").innerText = "inserisci una email valida"; 
                 return                              
                  } 
                                  
                  conta = 0;                
                  do {
                   lettera = email[conta] ; 
                   if (lettera === ',') {
                    document .getElementById("error").innerText = "inserisci una email valida"
                    return
                   }               
                          
                   if (lettera === '@')  chioc = lettera ; 
                                                     
                   conta++;
                   } while (conta <lengemail); 
      
                 if (chioc !== '@'){
                 document .getElementById("error").innerText = "inserisci una email valida"; 
                 return                              
                 } 
                                 
                   const emailPulita1 = String(email).trim().toLowerCase(); 
                   const emailPulita2 =  emailPulita1.replaceAll(".", "a");
                   const emailPulita3  = emailPulita2.replaceAll("@", "a"); 
                   const emailPulita4  = emailPulita3.replaceAll("i", "s"); 
                   const emailPulita5  = emailPulita4.replaceAll("o", "s"); 
                   const emailPulita6  = emailPulita5.replaceAll("e", "s"); 
                   chiaveCasella = emailPulita6.split('').reverse().join('');
 
                    insertCasella()
                      
        })        

           async function insertCasella() {

   
            // Controlla la memoria interna del telefono
            mioIdCasella = localStorage.getItem("id_casella_postale");
    
            if (mioIdCasella) {
            document .getElementById("error").innerText = "la casella è già presente"; 
            return
            
             }

            
            mioIdCasella = chiaveCasella ; 
           

       // 1. Riferimento al documento usando il valore come ID
        const docRef = doc(db, "casella_postale", mioIdCasella);
  
        // 2. Tenta di recuperare il documento
        const docSnap = await getDoc(docRef);

       // 3. Verifica l'esistenza usando .exists()
       if (docSnap.exists()) {
       document .getElementById("error").innerText = "la casella è già presente"; 
       return false;
        }

         // 4. Se NON esiste, procedi con l'inserimento
               await setDoc(docRef, { 
           creatoIl: new Date() 
           
           });
           localStorage.setItem("id_casella_postale", mioIdCasella)

     //      "La casella è stata creata" vado apunto morto per la pubblicità   
           window.location.href = "index.html";
}


                 document.getElementById('logoutBtn').addEventListener('click', function() {    
              // 3. Reindirizza alla pagina di login
               window.location.href = "index.html";
              })

  </script> 
  
  </body>
  </html>
