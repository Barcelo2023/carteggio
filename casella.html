<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>

    <link rel="icon" href="img/logo.png"  type="image/png">
    <link rel="stylesheet" href="style-casella.css"> <!-- Il file CSS -->  

     <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7064918153021324"
     crossorigin="anonymous"></script>
  
  </head>
  <body>
         
        <div class="container">
  <h1>Carteggio</h1>
  <h2>Pagina crea casella postale</h2>

  <p>Scrivi la tua email</p>
 
  <input type="text" id="email"  required autocomplete="off">

  <div id="error"></div> 
  
  <button type="button" id="btnv">Crea casella</button>           
  <button id="logoutBtn" type="button">Pagina iniziale</button>

  <input type="text" name="data" id="data" readonly>
</div>

      
    
         <script type="module"> 
     let mioIdCasella;
     let chiaveCasella;
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
     import { getFirestore,collection, getDoc, setDoc, addDoc,  doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
     
 
            let data = new Date(); 
            document.getElementById('data').value = (data); 


           
            let  email;                    
            let lengemail;
            let conta;
            let lettera;
            let chioc;

                       // Esegui il controllo all'avvio della pagina

                                            // Esegui il controllo all'avvio della pagina
           window.addEventListener('DOMContentLoaded', () => {
            bloccaAccessoDaPC();
            });



                   function bloccaAccessoDaPC() {
    // 1. Controlla la larghezza dello schermo (smartphone sotto i 768px)
    const isLarghezzaMobile = window.innerWidth <= 768;

    // 2. Controlla se il dispositivo supporta il touch screen
    const supportaTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    // 3. Controlla lo User-Agent del browser per cercare parole chiave mobile
    const userAgent = navigator.userAgent.toLowerCase();
    const isMobileAgent = /iphone|ipad|ipod|android|blackberry|iemobile|opera mini/i.test(userAgent);

    // Se non è una larghezza mobile, non ha il touch o non ha un agente mobile, allora è un PC
    if (!isLarghezzaMobile || !supportaTouch || !isMobileAgent) {
        
    
            // Se l'elemento HTML non è ancora pronto, usa l'alert con la tua frase

            document.getElementById('email').disabled = true; 
            document.getElementById('btnv').disabled = true; 
            document .getElementById("error").innerText = "La casella può essere creata solo dal telefono"; 
            return
        }
                   }
    
              // 1. Aggiunto 'async' prima della funzione del listener
document.getElementById('btnv').addEventListener('click', async function() { 
    
    // Dichiarazione variabili locali
    let email = document.getElementById('email').value; 
    let chioc = " ";
    let lengemail = email.length;

    // Validazione lunghezza
    if (lengemail < 5) {
        document.getElementById("error").innerText = "inserisci una email valida"; 
        return;                              
    } 
                    
    // Controllo caratteri della mail
    let conta = 0;                
    do {
        let lettera = email[conta]; 
        if (lettera === ',') {
            document.getElementById("error").innerText = "inserisci una email valida";
            return;
        }               
               
        if (lettera === '@') chioc = lettera; 
                                          
        conta++;
    } while (conta < lengemail); 

    // Controllo presenza chiocciola
    if (chioc !== '@') {
        document.getElementById("error").innerText = "inserisci una email valida"; 
        return;                              
    } 

    // Funzione interna per generare l'hash
    async function generaChiaveNumerica() {
        const emailPulita = email.trim().toLowerCase();
        const encoder = new TextEncoder();
        const data = encoder.encode(emailPulita);
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return BigInt('0x' + hashHex).toString();     
    }
       
    // Funzione interna per l'inserimento
    async function insertCasella() {
        try {
            // Genera l'ID univoco numerico dall'email
            const mioIdCasella = await generaChiaveNumerica();

            // CORREZIONE: Controlla se l'utente ha GIÀ registrato una casella in questo browser
            const localeId = localStorage.getItem("id_casella_postale");
            if (localeId) {
                document.getElementById("error").innerText = "la casella è già presente sul dispositivo"; 
                return;
            }      

            // 1. Riferimento al documento usando l'hash come ID
            const docRef = doc(db, "casella_postale", mioIdCasella);
      
            // 2. Tenta di recuperare il documento da Firestore
            const docSnap = await getDoc(docRef);

            // 3. Verifica l'esistenza nel database
            if (docSnap.exists()) {
                document.getElementById("error").innerText = "la casella è già presente nel database"; 
                return;
            }

            // 4. Se NON esiste, procedi con l'inserimento
            await setDoc(docRef, { 
                creatoIl: new Date() 
            });

            // Salva l'ID generato nel localStorage
            localStorage.setItem("id_casella_postale", mioIdCasella);

            // Reindirizza l'utente
            window.location.href = "successo.html";

        } catch (error) {
            console.error("Errore durante l'inserimento:", error);
            document.getElementById("error").innerText = "Errore di connessione o salvataggio";
        }
    } // Chiude insertCasella

    // ESEGUE la funzione di inserimento dopo che i controlli iniziali sono passati
    await insertCasella();

}); // Chiude addEventListener















           
                 document.getElementById('logoutBtn').addEventListener('click', function() {    
              // 3. Reindirizza alla pagina di login
               window.location.href = "index.html";
              })

  </script> 
  
  </body>
  </html>
