<!DOCTYPE html>
     <html lang="it">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>
   
    <link rel="stylesheet" href="style-casella.css"> <!-- Il file CSS -->  
               
      <script  src="dataora.js"></script>
  
    </head>
    <body>
         
       <div class="container">     
       <div  id="datetime"> </div>
       <h1>Carteggio</h1>
      <h2>Pagina crea casella</h2>
     
      <p id="error"></p>
      <p id="label"></p>
     
      <input type="text" id="chiave">
  
      <button type="button" id="btngratis"  >Crea casella</button> 
         
      <button id="logoutBtn" type="button">Pagina iniziale</button>
 
      </div>      
    
         <script type="module"> 
       
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db, ottieniUtentePronto  } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
     import { getFirestore,collection ,addDoc,  doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
                     
           
           caricodata();

            document.getElementById('btngratis').addEventListener('click', function() { 
                           
            // Controlla la memoria interna del dispositivo
            const mioIdCasella = localStorage.getItem("id_casella_postale");
    
            if (mioIdCasella) {
              // la casella esiste già
             document.getElementById('label').innerText = 'Indirizzo casella salvalo e comunicalo'; 
             document.getElementById('chiave').value = mioIdCasella; 
             return
             }
         
               insertCasella().then(chiave => {                
               const chiaveCasella = chiave ;  

               document.getElementById('label').innerText = 'Indirizzo casella salvalo e comunicalo'; 
               document.getElementById('chiave').value = chiaveCasella; 
               chiaveCasella
               localStorage.setItem('id_casella_postale', chiaveCasella);          
               localStorage.setItem('accessi_pubblicita', 0);
               localStorage.setItem('consenso_cookie_marketing', 'true'); 
               localStorage.setItem('account_status', 'ads');
               
               })                
      })                
       
       async function insertCasella() {          
          
          await ottieniUtentePronto(); 
          
          const dati = {
            creato: new Date() ,
            sigla: "aut"
       };
          try {
            const docRef = await addDoc(collection(db, "casella_postale"), dati);
                     
            return docRef.id;
                } catch (e) {
                document.getElementById("error").innerText = "errore inserimento casella ";
                            
             return
            }                   
         
        }        
            
                 document.getElementById('logoutBtn').addEventListener('click', function() {    
              // 3. Reindirizza alla pagina di login
               window.location.replace("/index.html");    
              
              })

  </script> 
  
  </body>
  </html>
