<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>
     
     <link rel="stylesheet" href="style-leggi.css"> <!-- Il file CSS --> 
  
   <script  src="dataora.js"></script>
      
    <!-- INCOLLALO QUI IN TUTTE LE PAGINE -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7064918153021324" crossorigin="anonymous"></script>
    </head>

  <body>
        

    <div class="container">
      <div  id="datetime"> </div>
       <h1>Carteggio</h1> 
     <h2>Pagina leggi messaggi</h2>
                    
    
      <p id="parm">Messaggio</p>
      <textarea  name="message" id="message" rows="4" readonly></textarea>             
       <div id="error" ></div>
       <button  type="button" id="estrae"    >Estrae messaggio</button>

       <button  type="button" id="decripta"  disabled = "disabled" >Decripta messaggio</button>       
        
      <button  type="button" id="cancella"   disabled = "disabled" >Cancella messaggio</button>
      

       <button type="button" id="logoutBtn">Pagina iniziale</button>

         
    
        
       </div>
           <script type="module"> 
          let chiaveAttiva = null; 
       let chiaveDocumento = null;
       let numeroRandom  ;

           // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
                   import { db, ottieniUtentePronto  } from "./firebaseConfig.js";
         // Import the functions you need from the SDKs you need
      
       import { getFirestore,collection,  getDoc, getDocs, deleteDoc, doc} from
        "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
       
      
    
        let numero ;        
        let conta;
        let testoMessage;
        let lunghezza;
        let lettera;
        let converti;
        let pari;     
        let stringaConverti;
        let dati;
        let togli;
        
             caricodata();       
             
             const estrae = document.getElementById('estrae');
             estrae.addEventListener('click', function() { 

             chiaveAttiva = localStorage.getItem('id_casella_postale'); 
     
              // Sicurezza: se l'ID non esiste nel localStorage, si ferma subito
            if (!chiaveAttiva) {
             document.getElementById("error").innerText = "non hai creato una casella operazione negata ";
            return 
            }            
    
             leggiUtenti().then(data => {
              if (chiaveDocumento === 'nonce') return
               
              
            let  datoDaFirestore= data.sigla; 
              testoMessage= data.messaggio;

            // Taglia i primi 4 caratteri ("indx") e prende tutto il resto
            let parteVariabile = datoDaFirestore.slice(4); 

             numeroRandom = parseInt(parteVariabile, 36);
              numeroRandom =numeroRandom -3;

              pari=numeroRandom;
             togli = 1;             
  
              if (pari % 2 == 0) {  
              togli = 2;
             }
            
              
             document.getElementById('message').value = data.messaggio;
             document.getElementById('decripta').disabled = false; 
             document.getElementById('estrae').disabled = true;  
             });              
          
            
      })      
             const decripta = document.getElementById('decripta');
             decripta.addEventListener('click', function() {  
                                                                       
             stringaConverti = "";
              numero =numeroRandom; 
              lunghezza = testoMessage.length;              

             for ( conta=0; conta <lunghezza; conta ++)
	             {		
                lettera = testoMessage[conta] ;  	     		 
                converti = lettera.charCodeAt(0);                 
	  	          pari = conta;	  	  	  	  
               if (pari %2 == 0) {  
               converti=converti + numero;               
                }
               else{     
                 converti = converti - numero;                 
               }
                                  
                  if(numero <= 2){
                  numero=numeroRandom ;                          
                  numero = numero  -togli; 
                  }
                   numero = numero  -togli;   
		         stringaConverti+=String.fromCharCode(converti) ; 

            } 
                  const ritorno = stringaConverti;
                  const ritornomodificato = new TextDecoder().decode(Uint8Array.from(atob(ritorno), m => m.codePointAt(0)));

                  stringaConverti = ritornomodificato;

                  document.getElementById('message').value  = ""; 
                 document.getElementById("message").value = stringaConverti;
                 document.getElementById('cancella').disabled = false; 
                 document.getElementById('decripta').disabled = true;                
          })  
          
          
                 const cancella = document.getElementById('cancella');
       cancella.addEventListener('click', function() { 
    
                deleteRecord();                                        
               
               
              document.getElementById('cancella').disabled = false;  
               })
           

        
              async function leggiUtenti() { 
                await ottieniUtentePronto(); 

          // 1. Crea il riferimento al documento specifico passando la chiave
           const ricevutiRef = collection(db, "casella_postale", chiaveAttiva, "ricevuti");
      
          // 2. Esegui la lettura
           const snapshotRicevuti = await getDocs(ricevutiRef);

             if (snapshotRicevuti.empty) {
             document.getElementById("error").innerText = "Non ci sono messaggi"; 
              chiaveDocumento = 'nonce';
              return  ;
            }                   
            chiaveDocumento = snapshotRicevuti.docs[0].id;
  
            // 1. Crea il riferimento al documento (collezione, idDocumento)
            const docRef = doc(db, "messaggi", chiaveDocumento);
            // 2. Ottieni lo snapshot
             const docSnap = await getDoc(docRef);
  
            // 3. Verifica se esiste e ottieni i dati
            if (docSnap.exists()) {                                    
           return docSnap.data();
          } else {
             document .getElementById("error").innerText = "non ci sono messaggi  "; 
        }
       }
           
            async function deleteRecord(){

  
         try {
         // Crea il riferimento al documento: doc(db, "collezione", "id_documento")
            const docRef = doc(db, "messaggi", chiaveDocumento);

          // Elimina il documento
          await deleteDoc(docRef);
        
          
  // 5. Cancella l'idDocumento dalla sottocollezione "ricevuti"
        const riferimentoRicevutoDaCancellare = doc(db, "casella_postale", chiaveAttiva, "ricevuti", chiaveDocumento);
        await deleteDoc(riferimentoRicevutoDaCancellare);
        
           
           document .getElementById("error").innerText = "il messaggio è stato cancellato con successo.";

            document.getElementById('cancella').disabled = true; 
            return

       } catch (error) {
        console.error("Errore durante il processo:", error);
         document.getElementById("message").value = "errore durante il processo";
    }
  }
     

         document.getElementById('logoutBtn').addEventListener('click', function() {    
              // 3. Reindirizza alla pagina di login
               window.location.href = "index.html";
              })
        
    </script>
     
        
 </body>
 </html>
