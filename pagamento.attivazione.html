<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Carteggio</title>
   
    <link rel="stylesheet" href="style.pagamento.css"> <!-- Il file CSS -->  
               
     <script  src="dataora.js"></script>
     <script  src="https://www.paypal.com/sdk/js?client-id=Adxi4hglDMh8V9Kk1TujGHkB-qx3b-z4STAICTo2ZeNtaJ2dxsIb9I_Cv4K-Byxik6tdLoEMv_PagqT_"></script>
     <script src="https://paypal.com"></script>
  
   </head>
    <body>

    <div class="container">

        
      <div  id="datetime"> </div>
     <h1>Carteggio</h1>
     <h2>Pagamento con PayPal</h2>
     
      <p id="error"></p>       
       <p id="label"></p> 
        
        <!-- Il contenitore di PayPal ora segue perfettamente le regole del tuo foglio di stile -->
        <div id="paypal-button-container"></div>
        
        <button id="logoutBtn"> Pagina iniziale</button>
    </div>
     
       <script type="module"> 
       
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db, ottieniUtentePronto  } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
     import { getFirestore,collection ,  doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
                     
     // Genera l'ID locale (senza toccare il DB)
      const miaNuovaCasellaID = doc(collection(db, "casella_postale")).id; 
           caricodata();
            document.getElementById('label').textContent = 'Attivazione casella';

     // Lo salvi nel localStorage con un nome mascherato per sviare occhi indiscreti
         localStorage.setItem('temp_id_casella_postale', miaNuovaCasellaID);
  

       paypal.Buttons({
         createOrder: function(data, actions) {
        return actions.order.create({
            purchase_units: [{
                amount: { currency_code: 'EUR', value: '5.00' },
                description: `ATTIVAZIONE CASTELLA ANONIMA. Indirizzo casella da comunicare per ricevere messaggi è: ${miaNuovaCasellaID}`,
                custom_id: miaNuovaCasellaID // Lo passi comunque a PayPal per la ricevuta
            }]
        });
    },
    onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
            // Pagamento riuscito! Mandi l'utente alla pagina di creazione SENZA ID nell'URL
            window.location.href = "attivazione.casella.html";
        });
    }
     }).render('#paypal-button-container');

         document.getElementById('logoutBtn').addEventListener('click', function() {    
           // 3. Reindirizza alla pagina di login
           window.location.replace("/index.html");
              })
    </script>

</body>
</html>
