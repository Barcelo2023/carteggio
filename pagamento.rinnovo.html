<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Carteggio</title>
   
    <link rel="stylesheet" href="style.pagamento.css"> <!-- Il file CSS -->  
               
     <script  src="dataora.js"></script>
     <script  src="https://www.paypal.com/sdk/js?client-id=Adxi4hglDMh8V9Kk1TujGHkB-qx3b-z4STAICTo2ZeNtaJ2dxsIb9I_Cv4K-Byxik6tdLoEMv_PagqT_"></script>
     

  
   </head>
    <body>

    <div class="container">

        
      <div  id="datetime"> </div>
     <h1>Carteggio</h1>
     <h2>Pagamento con PayPal</h2>
     
      <p id="error"></p>       
       <p id="label"></p>  
        
        <!-- Il contenitore di PayPal ora segue perfettamente le regole del tuo foglio di stile -->
        <div id="paypal-button-container"></div>
        
        <button id="logoutBtn"> Pagina iniziale</button>
    </div>
     
      <script>
           caricodata();
     // Recupera l'ID della casella che l'utente sta usando attualmente
      document.getElementById('label').textContent = 'Rinnovo mesile casella  1,75$';
       const idCasellaCorrente= localStorage.getItem("id_casella_postale");

         localStorage.setItem('tipo_pagamento', 'rinnovo')

      paypal.Buttons({
      
       createOrder: function(data, actions) {
        return actions.order.create({
            purchase_units: [{
                amount: { currency_code: 'USD', value: '1.75' }, // Prezzo rinnovo trimestrale
                description: `Rinnovo Mensile Casella: ${idCasellaCorrente}`,
                custom_id: idCasellaCorrente // Collega l'ID al pagamento su PayPal
            }]
        });
    },
    onApprove: function(data, actions) {
    return actions.order.capture().then(function(details) {
        // Pagamento riuscito!
          if (window.opener) {
            window.opener.location.replace("/rinnovo.casella.html");
            window.close(); // Chiude il pop-up di PayPal automaticamente
        } else {
            window.location.replace("/rinnovo.casella.html");
        }
    }).catch(function(error) {
        console.error("Errore durante la cattura dei fondi:", error);
        // Gestione errore in fase di cattura
        window.location.replace("/pagamento.non.eseguito.html");
    });
   },
    onError: function(err) {
        console.error("Errore generale PayPal:", error);
    // Se l'utente chiude la finestra o il pagamento fallisce a monte
    window.location.replace("/pagamento.non.eseguito.html");
   }

   
     }).render('#paypal-button-container'); // Un ID contenitore diverso se preferisci


    
         document.getElementById('logoutBtn').addEventListener('click', function() {    
           // 3. Reindirizza alla pagina di login
           window.location.replace("/index.html");
              })
    </script>

</body>
</html>
