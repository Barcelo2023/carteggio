<!DOCTYPE html>
    <html lang="it">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>
    
    <link rel="stylesheet" href="style-casella.css"> <!-- Il file CSS -->  
             
       <script  src="dataora.js"></script>
      <script  src="email.criptata.js"></script>
  
    </head>
     <body>
         
     <div class="container">     
     <div  id="datetime"> </div>
     <h1>Carteggio</h1>
      <h2>Pagina collega casella </h2>

      <p id="error"></p>
      <p id="label">Scrivi la tua e-mail</p>
 
     <input type="text" id="email"  autocomplete="off">

     <div id="error"></div> 
  
      <button type="button" id="btnv"  >Collega casella</button>           
      <button id="logoutBtn" type="button">Pagina iniziale</button>

  
      </div>     
    
         <script type="module"> 
     let mioIdCasella;
     let chiaveCasella;
    
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db, ottieniUtentePronto  } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
       import { getFirestore,collection, getDoc,   doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
                                        

             caricodata();

            document.getElementById('btnv').addEventListener('click', function() {  

                   // Controlla la memoria interna del dispositivo
                mioIdCasella = localStorage.getItem("id_casella_postale");
    
                if (mioIdCasella) {
                window.location.replace("/successo.html");                       
             } 
                 const numero = localStorage.getItem("numero_cancellazioni");
   
                 if (numero ) {        
                 document.getElementById("error").innerText = "vietato cancellare caselle cancellate"; 
                 return 
            }  
    
             const email = document.getElementById('email').value; 
                                                                         
              const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;            
              const emailDaControllare = (email);
              const isValid = emailRegex.test(emailDaControllare); 
              if (!isValid){
              document.getElementById("error").innerText = "inserisci una e-mail valida"; 
              return
   
              }
         
              
                   hashEmail(email).then(chiave => {
                   chiaveCasella = chiave;
 
                    controllaCasella();
               })                  
        
        })        

           async function controllaCasella() {                
          
              await ottieniUtentePronto();                    
   
       // 1. Riferimento al documento usando il valore come ID
        const docRef = doc(db, "casella_postale", chiaveCasella); 

        // 2. Tenta di recuperare il documento
        const docSnap = await getDoc(docRef);
 
       // 3. Verifica l'esistenza usando .exists()
       if (!docSnap.exists()) {
       document .getElementById("error").innerText = "la casella non esiste"; 
       return false;
        }
         const dati = docSnap.data();  
                  // 2. Estrai il campo specifico 
                  const mioCampo = dati.sigla;
                   if (mioCampo === 'can'){
                   document .getElementById("error").innerText = "vietato collegare caselle cancellate"; 
                    return  
                   }
           localStorage.setItem("id_casella_postale", chiaveCasella);
           localStorage.setItem('accessi_pubblicita', 4);
           localStorage.setItem('consenso_cookie_marketing', 'true'); 
           localStorage.setItem('account_status', 'ads');
           window.location.replace("/successo.html");   
           
           }
           
             document.getElementById('logoutBtn').addEventListener('click', function() {    
           // 3. Reindirizza alla pagina di login
           window.location.replace("/index.html");
              })

  </script> 
  
  </body>
  </html>
