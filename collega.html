     <body>
         
     <div class="container">     
    <div  id="datetime"> </div>
  <h1>Carteggio</h1>
  <h2>Pagina collega casella </h2>

  <p>Scrivi la tua e-mail</p>
 
  <input type="text" id="email"  required autocomplete="off">

  <div id="error"></div> 
  
  <button type="button" id="btnv"  >Collega casella</button>           
  <button id="logoutBtn" type="button">Pagina iniziale</button>

  
</div>     
    
         <script type="module"> 
     let mioIdCasella;
     let chiaveCasella;
    
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
     import { getFirestore,collection, getDoc, setDoc, addDoc,  doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
     
           
            let  email;                    
            let lengemail;
            let conta;
            let lettera;
            let chioc;

           caricodata();

            document.getElementById('btnv').addEventListener('click', function() {  

             const modificaemail = document.getElementById('email').value; 

             if(!modificaemail.startsWith("!")){
              document .getElementById("error").innerText = "manca carattere ! vedi info"; 
                return
              }

              email = modificaemail.slice(1);
              document .getElementById("error").innerText = "";            
               
              email = document.getElementById('email').value; 
              const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;            
              const emailDaControllare = (email);
              const isValid = emailRegex.test(emailDaControllare); 
              if (!isValid){
              document.getElementById("error").innerText = "inserisci una e-mail valida"; 
              return
   
              }

                  document .getElementById("error").innerText = "";              
                  
                   hashEmail(email).then(chiave => {
                   chiaveCasella = chiave;
 
                    controllaCasella();
               })
                  
        
        })        

           async function controllaCasella() {
           
          
                 // Controlla la memoria interna del telefono
            mioIdCasella = localStorage.getItem("id_casella_postale");
    
            if (mioIdCasella) {
            document .getElementById("error").innerText = "il dispositivo è già associato a una  casella"; 
            console.log(chiaveCasella);
            return
            
             } 
           
           
         
   
       // 1. Riferimento al documento usando il valore come ID
        const docRef = doc(db, "casella_postale", chiaveCasella);
  
        // 2. Tenta di recuperare il documento
        const docSnap = await getDoc(docRef);

       // 3. Verifica l'esistenza usando .exists()
       if (!docSnap.exists()) {
       document .getElementById("error").innerText = "la casella non esiste  verifica se e-mail corretta"; 
       return false;
        }
           localStorage.setItem("id_casella_postale", chiaveCasella)
           document .getElementById("error").innerText = "la casella é stata associata con successo"; 
           return
           }
           
             document.getElementById('logoutBtn').addEventListener('click', function() {    
           // 3. Reindirizza alla pagina di login
           window.location.href = "index.html";
              })

  </script> 
  
  </body>
  </html>
