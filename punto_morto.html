<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Aggiunto per ottimizzazione mobile -->
    <title>Caricamento...</title>
    
    <!-- Script Automatico di Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7064918153021324"
     crossorigin="anonymous"></script>


    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #242433; /* Sfondo scuro coordinato con l'app */
            font-family: sans-serif;
            color: #83abd8;            /* Testo azzurro ufficiale */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-container {
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .loading-container h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #83abd8;
        }

        /* Stile del link trasformato in un piccolo bottone elegante */
        #proseguiLink {
            display: inline-block;
            font-size: 18px; 
            color: #83abd8;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #35393d; /* Grigio scuro dei bottoni della Home */
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        #proseguiLink:active {
            background-color: #454a50;
        }
    </style>
</head>
<body>

    <div class="loading-container">
        <h2>Caricamento in corso...</h2>
        <!-- Il link reindirizza alla pagina finale di successo ed è ottimizzato per AdSense -->
        <a href="successo.html" id="proseguiLink">Clicca qui per proseguire</a>
    </div>

    <script>
        // Clicca automaticamente il link dopo 1 secondo per forzare AdSense a mostrare l'annuncio Interstitial
        setTimeout(() => {
            const link = document.getElementById('proseguiLink');
            if (link) link.click();
        }, 1000);
    </script>

</body>
</html>
