name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main  # <-- Cambia in 'master' se il tuo ramo principale si chiama master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUR_PROJECT_ID }} # <-- Lascia la tua chiave segreta attuale
          projectId: IL_TUO_ID_PROGETTO_FIREBASE # <-- Sostituisci con il tuo ID esatto di Firebase
          channelId: live
