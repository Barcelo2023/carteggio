<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>

    
    <link rel="stylesheet" href="style.cancella.css"  >

     <script  src="dataora.js"></script>
   
  </head>
  <body>
         
         <div class="container">
          <div  id="datetime"> </div>
        <h1>Carteggio</h1>
         <h2>Pagina cancella casella</h2>      
                 
        <p id="error"></p> 
        <p id="avviso"></p> 
        
         <button type="button" id="btnCasella" disabled="disabled" >Cancella casella</button> 
         <button  type="button"  id="segreto">...</button>          
         <button id="logoutBtn" type="button">Pagina iniziale</button>
          
     </div>  
         <script type="module"> 
     let mioIdCasella;
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db, ottieniUtentePronto  } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
     import { getFirestore,collection, setDoc,   doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
     
 
             caricodata();

               let ultimaVolta = 0;
              const segreto = document.getElementById('segreto');
              
              document.getElementById("avviso").innerText = "per abilitare il bottone cancella doppio click sui tre ...";

            // 1. Gestione per Telefono (Touch)
             segreto.addEventListener('touchend', function(event) {
              let tempoCorrente = new Date().getTime();
              let tempoTrascorso = tempoCorrente - ultimaVolta;
  
              if (tempoTrascorso < 300 && tempoTrascorso > 0) {
                 eseguiAzione();
                }
             ultimaVolta = tempoCorrente;
             });

           // 2. Gestione per PC (Mouse)
              segreto.addEventListener('dblclick', function(event) {
               eseguiAzione();
            });

            // 3. La funzione con l'azione da eseguire
             function eseguiAzione() {
           
            document.getElementById('btnCasella').disabled = false; 
             document.getElementById("avviso").innerText = "ora puoi cancellare la casella";
                
            }

            document.getElementById('btnCasella').addEventListener('click', function() { 
           
                
                 cancellaCasella();
                                           
            })           
             

             async function cancellaCasella() {
            // 1. Recupera l'ID salvato nel localStorage
            const mioIdCasella = localStorage.getItem("id_casella_postale");

             // Sicurezza: se l'ID non esiste nel localStorage, si ferma subito
            if (!mioIdCasella) {
             document.getElementById("error").innerText = "Non esiste casella postale";
            return false;
            }
                await ottieniUtentePronto(); 
           // 2. Crea il riferimento al documento
           const docRef = doc(db, "casella_postale", mioIdCasella);

          
                 await setDoc(docRef, { 
                 creato: new Date() ,
                 sigla: "can"
           
           });
        
            // 4. Pulisce il localStorage e aggiorna l'interfaccia
              localStorage.removeItem("id_casella_postale");
              localStorage.removeItem('accessi_pubblicita', 0);
              localStorage.removeItem('consenso_cookie_marketing', 'true'); 
              localStorage.removeItem('account_status', 'ads');
              window.location.replace("/successo.html");
              
          
      }

       
           document.getElementById('logoutBtn').addEventListener('click', function() {    
           // 3. Reindirizza alla pagina di login
            window.location.replace("/index.html");
              })

  </script> 
  
  </body>
  </html>
