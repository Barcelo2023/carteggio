<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Completata</title>
    <!-- Riusiamo lo stesso CSS della index per mantenere la grafica coerente -->
    <link rel="stylesheet" href="./style-index.css"> 
    <style>
        .pulsante-admob {
            display: inline-block;
            background-color: #28a745;
            color: white !important;
            padding: 12px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Carteggio</h1>
        <!-- Messaggio di conferma per l'utente -->
        <h2 style="color: #28a745; margin-top: 50px;">Operazione Completata!</h2>
        <p style="color: #83abd8; font-size: 18px; text-align: center; padding: 0 20px;">
            I tuoi dati sono stati elaborati con successo.
        </p>

        <div id="pulsanti" style="margin-top: 40px;">
            <!-- Il pulsante ora chiama la funzione combinata di AdMob + Navigazione -->
            <button type="button" onclick="mostraPubblicitaEChiudi()" class="pulsante-admob" id="btnRitornaHome">Pagina iniziale</button>
        </div>
    </div>

    <script>
        // 1. Forza il collegamento con il file cordova di sistema fornito da Appy Pie
        if (typeof window.cordova === 'undefined') {
            const script = document.createElement('script');
            script.src = 'cordova.js';
            document.head.appendChild(script);
        }

        // 2. Funzione principale eseguita al clic sul pulsante verde
        function mostraPubblicitaEChiudi() {
            console.log("AdMob: Clic rilevato. Tento il recupero dei plugin di Appy Pie...");

            // Controlliamo se i plugin AdMob di Cordova inseriti da Appy Pie sono attivi nella memoria globale
            const admobPlugin = window.admob || (window.cordova && window.cordova.plugins && window.cordova.plugins.AdMob) || window.AdMob;

            if (admobPlugin) {
                try {
                    console.log("AdMob: Plugin rilevato con successo! Tento la visualizzazione forzata...");
                    
                    // Comandi standard di mostratura per i vari plugin Cordova usati dai creatori no-code
                    if (typeof admobPlugin.showInterstitial === 'function') {
                        admobPlugin.showInterstitial();
                    } else if (typeof admobPlugin.interstitial?.show === 'function') {
                        admobPlugin.interstitial.show();
                    } else if (typeof admobPlugin.showInterstitialAd === 'function') {
                        admobPlugin.showInterstitialAd();
                    }

                    // Ascolta la chiusura dell'annuncio per cambiare pagina senza interromperlo
                    document.addEventListener('onDismissInterstitialAd', andareAllaHome);
                    document.addEventListener('admob.interstitial.dismiss', andareAllaHome);
                    
                    // Timer di sicurezza: se l'utente chiude la pubblicità o se si blocca, cambia pagina comunque dopo 4 secondi
                    setTimeout(andareAllaHome, 4000);

                } catch (err) {
                    console.error("AdMob: Errore durante l'esecuzione del plugin nativo", err);
                    andareAllaHome();
                }
            } else {
                console.log("AdMob: Nessun plugin nativo trovato nella pagina web, cambio pagina diretto.");
                andareAllaHome();
            }
        }

        function andareAllaHome() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
