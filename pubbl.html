<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Completata</title>
    <!-- Riusiamo lo stesso CSS della index per mantenere la grafica coerente -->
    <link rel="stylesheet" href="./style-index.css"> 
    
    <!-- 1. Carica la libreria pubblicitaria ufficiale di Google AdMob / AdSense via Web -->
    <script async src="https://doubleclick.net"></script>
    <script>
        window.googletag = window.googletag || { cmd: [] };
        let interstitialSlot;

        // Inizializza l'annuncio interstiziale di test appena la pagina si apre
        googletag.cmd.push(() => {
            interstitialSlot = googletag.defineOutOfPageSlot(
                '/6499/example/interstitial', // Percorso dell'interstiziale di prova universale di Google
                googletag.enums.OutOfPageFormat.INTERSTITIAL
            );

            if (interstitialSlot) {
                interstitialSlot.addService(googletag.pubads());
                console.log("AdMob Web: Annuncio interstiziale registrato in background.");
            }
            
            googletag.pubads().enableSingleRequest();
            googletag.enableServices();
        });

        // Ascolta quando l'annuncio viene chiuso sul display per cambiare pagina
        googletag.cmd.push(() => {
            googletag.pubads().addEventListener('slotRenderEnded', (event) => {
                console.log("AdMob Web: Annuncio visualizzato correttamente.");
            });
        });
    </script>

    <style>
        .pulsante-admob {
            display: inline-block;
            background-color: #28a745;
            color: white !important;
            padding: 12px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Carteggio</h1>
        <!-- Messaggio di conferma per l'utente -->
        <h2 style="color: #28a745; margin-top: 50px;">Operazione Completata!</h2>
        <p style="color: #83abd8; font-size: 18px; text-align: center; padding: 0 20px;">
            I tuoi dati sono stati elaborati con successo.
        </p>

        <div id="pulsanti" style="margin-top: 40px;">
            <!-- Il pulsante ora chiama l'attivazione della pubblicità web -->
            <button type="button" onclick="mostraPubblicitaWeb()" class="pulsante-admob" id="btnRitornaHome">Pagina iniziale</button>
        </div>
    </div>

    <script>
        function mostraPubblicitaWeb() {
            console.log("AdMob Web: Clic sul pulsante rilevato.");
            
            // Forza Google a mostrare l'interstiziale preparato in memoria
            googletag.cmd.push(() => {
                const mostrato = googletag.display(interstitialSlot);
                console.log("AdMob Web: Tentativo di apertura a schermo intero...");
            });

            // Sposta l'utente alla Home dopo un piccolo ritardo per permettere il caricamento
            setTimeout(() => {
                window.location.href = "index.html";
            }, 800); 
        }
    </script>

</body>
</html>
