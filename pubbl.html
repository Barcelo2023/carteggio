<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Completata</title>
    <!-- Riusiamo lo stesso CSS della index per mantenere la grafica coerente -->
    <link rel="stylesheet" href="./style-index.css"> 
    <style>
        .pulsante-admob {
            display: inline-block;
            background-color: #28a745;
            color: white !important;
            padding: 12px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Carteggio</h1>
        <!-- Messaggio di conferma per l'utente -->
        <h2 style="color: #28a745; margin-top: 50px;">Operazione Completata!</h2>
        <p style="color: #83abd8; font-size: 18px; text-align: center; padding: 0 20px;">
            I tuoi dati sono stati elaborati con successo.
        </p>

        <div id="pulsanti" style="margin-top: 40px;">
            <!-- Usiamo un finto link con javascript per forzare il sistema -->
            <a onclick="forzaUscitaEMostraAd()" class="pulsante-admob" id="btnRitornaHome">Pagina iniziale</a>
        </div>
    </div>

    <script>
        function forzaUscitaEMostraAd() {
            // Questo comando forza la WebView di Appy Pie a resettare la sessione.
            // Il sistema nativo dell'app rileverà la chiusura della pagina web esterna
            // e attiverà l'annuncio interstiziale di AdMob prima di ricaricare la index.
            window.location.replace("index.html");
        }
    </script>

</body>
</html>
