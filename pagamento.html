<!DOCTYPE html>
     <html lang="it">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>
   
    <link rel="stylesheet" href="style-casella.css"> <!-- Il file CSS -->  
      
    
      <script  src="email.criptata.js"></script>
      <script  src="dataora.js"></script>
  
    </head>
    <body>
         
       <div class="container">     
       <div  id="datetime"> </div>
       <h1>Carteggio</h1>
      <h2>Pagina pagamento</h2>
     
      <p id="error"></p>
      <p id="label">Scrivi la tua e-mail</p>
      <input type="text" id="email" autocomplete="off">
  
      <button type="button" id="btnpaga"  >Richiesta pagamento</button> 
         
      <button id="logoutBtn" type="button">Pagina iniziale</button>
 
      </div>      
    
         <script type="module"> 
        let mioIdCasella;
        let chiaveCasella;
         let  email;       
          // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
      import { db, ottieniUtentePronto  } from "./firebaseConfig.js";
           // Import the functions you need from the SDKs you need
    
     import { getFirestore,collection, getDoc, setDoc,  doc} from
       "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";
                     
           
           caricodata();

            document.getElementById('btnpaga').addEventListener('click', function() { 
             document.getElementById("error").innerText = "servizio pagamento in allestimento"; 
             return   
             
             email = document.getElementById('email').value; 
             
              const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;            
              const emailDaControllare = (email);
              const isValid = emailRegex.test(emailDaControllare); 
              if (!isValid){
              document.getElementById("error").innerText = "inserisci una e-mail valida"; 
              return 
              }   
              
               document.getElementById("error").innerText = ""; 
            
               hashEmail(email).then(chiave => {
                   chiaveCasella = chiave;

                    insertCasella();
               })                 
                      
        })        

           async function insertCasella() {
   
            // Controlla la memoria interna del telefono
            mioIdCasella = localStorage.getItem("id_casella_postale");
    
            if (mioIdCasella) {
            document .getElementById("error").innerText = "il dispositivo è già associato a una casella"; 
            return
            
             }
            mioIdCasella = chiaveCasella;
          await ottieniUtentePronto();    
    
       // 1. Riferimento al documento usando il valore come ID
        const docRef = doc(db, "casella_postale", mioIdCasella);
  
        // 2. Tenta di recuperare il documento
        const docSnap = await getDoc(docRef);

       // 3. Verifica l'esistenza usando .exists()
       if (docSnap.exists()) {
       document .getElementById("error").innerText = "la casella esiste già"; 
       return false;
        }

         // 4. Se NON esiste, procedi con l'inserimento
               await setDoc(docRef, { 
           creato: new Date() ,
           sigla: "aut"
           
           });
           localStorage.setItem("id_casella_postale", mioIdCasella)           
           localStorage.setItem('accessi_pubblicita', 999);
        
           window.location.href = "index.html";
                    
    }
             


                 document.getElementById('logoutBtn').addEventListener('click', function() {    
              // 3. Reindirizza alla pagina di login
               window.location.href = "index.html";
              })

  </script> 
  
  </body>
  </html>
