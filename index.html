<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteggio</title>

    
    <link rel="stylesheet" href="style-index.css"> <!-- Il file CSS --> 
   
          <script  src="carico.pubbl.js"></script>
           <script  src="dataora.js"></script>
</head>
<body>

    <div class="container">
         <div  id="datetime"> </div>
        <h1>Carteggio</h1>
        <h2>Pagina iniziale</h2>
        <div id="pulsanti">
            <button id="btncasella" type="button">Crea casella </button>                  
            <button id="btnscrivi" type="button">Scrivi messaggi</button>                             
            <button id="btnleggi" type="button"> Se rosso ci sono messaggi</button>
            <button id="btncancella" type="button">Cancella casella </button>
            <button id="btncifra" type="button">Dimostrazione cifratura</button>
            <button id="btninfo" type="button">Info app</button>
            <button id="btnlogout" type="button">Logout</button>
        </div> 
       
                        
    <script type="module">
        // 1. IMPORTANTE: Devi importare esplicitamente "db" dal tuo file locale
        import { db } from "./firebaseConfig.js";
        
        // 2. Importi solo le funzioni di cui questa pagina ha bisogno (corretto l'URL con www.)
        import { getFirestore, collection, onSnapshot } from 
        "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js"; 
        
        let unsubscribeFaro = null;

           caricodata()


        function avviaControlloFaro(chiaveAttiva) {
            const ricevutiRef = collection(db, "casella_postale", chiaveAttiva, "ricevuti");

            unsubscribeFaro = onSnapshot(ricevutiRef, (snapshot) => {
                const btnLeggi = document.getElementById("btnleggi");
                if (!btnLeggi) return;

                if (!snapshot.empty) {
                    btnLeggi.classList.add("bottone-notifica-attiva"); // Avvia il lampeggiamento rosso
                } else {
                    btnLeggi.classList.remove("bottone-notifica-attiva"); // Rimuove il lampeggiamento
                }
            });
        }

        // 1. Recupera l'ID specifico salvato nel localStorage di questo dispositivo
        const chiaveDinamica = localStorage.getItem("id_casella_postale"); 

        // 2. Verifica che la casella sia effettivamente configurata sul telefono/PC
        if (chiaveDinamica) {
            console.log("Faro avviato con successo per la casella:", chiaveDinamica);
            // Avvia il controllo in tempo reale per questo utente specifico
            avviaControlloFaro(chiaveDinamica);
        } else {
            console.log("Nessuna casella postale configurata su questo dispositivo."); 
        }             
        
        // GESTIONE DEI PULSANTI ORIGINALI
        const casella = document.getElementById('btncasella');
        casella.addEventListener('click', function() { 
            window.location.href = "casella.html";
        }); 
          
        const scrivi = document.getElementById('btnscrivi');
        scrivi.addEventListener('click', function() { 
            window.location.href = "scrivi.html";
        });  
          
        const leggi = document.getElementById('btnleggi');
        leggi.addEventListener('click', function() { 
            window.location.href = "leggi.html";
        });  

        const cancella = document.getElementById('btncancella');
        cancella.addEventListener('click', function() { 
            window.location.href = "cancella.html";
        });  

         const cifra = document.getElementById('btncifra');
        cifra.addEventListener('click', function() { 
            window.location.href = "cifratore.html";
        });         
        
        const info = document.getElementById('btninfo');
        info.addEventListener('click', function() { 
            window.location.href = "info.html";
        });  
          const esco = document.getElementById('btnlogout');
        esco.addEventListener('click', function() { 
            window.location.href = "https://google.com";
        });                
    </script>
    
</body>
</html>
